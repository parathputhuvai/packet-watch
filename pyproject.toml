[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-watch"
version = "1.0.0"
description = "Windows CLI passive network intrusion analyzer"
requires-python = ">=3.10"
dependencies = [
  "scapy>=2.6,<3",
  "rich>=13,<16",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "fpdf2>=2.7,<3",
]

[project.scripts]
packet-watch = "packet_watch.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
